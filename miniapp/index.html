<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andri Store — Mini App</title>
<style>
  :root{
    --bg-main:#0B0714;
    --bg-secondary:#130D24;
    --bg-card:#1C1430;
    --purple:#8B5CF6;
    --purple-bright:#A78BFA;
    --cyan:#22D3EE;
    --green:#10B981;
    --red:#EF4444;
    --text-main:#F8FAFC;
    --text-sub:#94A3B8;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding:20px;
  }

  .phone{
    position:relative;
    width:390px;
    height:844px;
    background:var(--bg-main);
    border-radius:44px;
    border:8px solid #050208;
    box-shadow:
      0 0 0 1px rgba(139,92,246,0.25),
      0 0 60px rgba(139,92,246,0.35),
      0 40px 80px rgba(0,0,0,0.8);
    overflow:hidden;
  }

  .screen{
    position:relative;
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none;}

  /* ambient glow blobs */
  .glow-blob{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    pointer-events:none;
    z-index:0;
  }
  .glow-1{width:280px;height:280px;background:rgba(139,92,246,0.25); top:-80px; right:-100px;}
  .glow-2{width:240px;height:240px;background:rgba(34,211,238,0.12); top:400px; left:-100px;}

  /* status bar */
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px 6px 26px;
    font-size:15px; font-weight:600; color:var(--text-main);
    position:relative; z-index:2;
  }
  .status-icons{display:flex; align-items:center; gap:6px;}
  .telegram-pill{
    position:absolute; left:50%; transform:translateX(-50%);
    top:12px;
    background:linear-gradient(135deg,#2AABEE,#229ED9);
    color:#fff; font-size:11px; font-weight:700;
    padding:5px 12px; border-radius:20px;
    display:flex; align-items:center; gap:5px;
    box-shadow:0 0 16px rgba(42,171,238,0.6);
    letter-spacing:0.3px;
  }

  /* header */
  .header{
    position:relative; z-index:2;
    padding:26px 20px 14px 20px;
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  .header-left{
    display:flex; flex-direction:column; gap:6px; max-width:150px;
  }
  .hamburger{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(139,92,246,0.12);
    border:1px solid rgba(139,92,246,0.4);
    border-radius:10px;
    box-shadow:0 0 12px rgba(139,92,246,0.35);
  }
  .hamburger svg{width:16px;height:16px;}
  .header-hint{
    display:flex; align-items:center; gap:4px;
    font-size:10.5px; color:var(--text-sub); line-height:1.35;
    margin-top:2px;
  }
  .header-hint .arrow{color:var(--purple-bright); font-size:12px;}

  .header-center{
    position:absolute; left:50%; top:26px; transform:translateX(-50%);
    text-align:center; white-space:nowrap;
  }
  .header-center .title{
    font-size:19px; font-weight:800; color:var(--text-main);
    display:flex; align-items:center; gap:5px; justify-content:center;
  }
  .header-center .badge{
    width:16px; height:16px; border-radius:50%;
    background:linear-gradient(135deg,var(--purple),var(--cyan));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 8px rgba(139,92,246,0.7);
  }
  .header-center .badge svg{width:9px;height:9px; color:#fff;}
  .header-center .subtitle{
    font-size:11px; color:var(--purple-bright); margin-top:2px; font-weight:600;
  }

    position:relative;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
